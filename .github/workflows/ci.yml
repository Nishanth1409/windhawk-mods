name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure featured mods present
        run: |
          set -e
          for d in lock-screen-wallpaper mic-tray-switch per-monitor-wallpaper settings-styler-safe taskbar-always-visible-fullscreen translucent-windows tray-audio-output; do
            test -d "analysis/$d"
            echo "OK $d"
          done
          # Each mod lives in its own folder — no loose sources at analysis/
          if ls analysis/*.* >/dev/null 2>&1; then
            echo "Loose files under analysis/ (each mod needs its own folder):"
            ls -1 analysis/*.*
            exit 1
          fi
          test -f analysis/translucent-windows/translucent-windows.wh.cpp
          test -f analysis/translucent-windows/translucent-windows.wh.cpp.bak
          test -f analysis/translucent-windows/translucent-windows.wh.json
          echo "OK translucent-windows files"
          test -f analysis/settings-styler-safe/settings-styler-safe.wh.cpp
          test -f analysis/settings-styler-safe/settings-styler-safe.wh.json
          test -f analysis/settings-styler-safe/apply-settings.reg
          echo "OK settings-styler-safe files"
      - name: Validate JSON settings
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path('analysis').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print(f"Validated {len(list(pathlib.Path('analysis').rglob('*.json')))} JSON files")
          PY
      - name: Block personal user paths
        run: |
          if grep -R "Users\\\\nisha\|Users/nisha\|C:\\\\Users\\\\nisha" analysis --include='*.json' --include='*.wh.json'; then
            echo "Personal paths found in settings"; exit 1
          fi
          echo "No personal user paths in JSON"
